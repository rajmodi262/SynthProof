name: CI

on:
  # Every push, on every branch. CI used to run only on master/main and PRs, so work on a
  # feature branch had no checks until someone remembered `gh workflow run` -- the 2026-10-11
  # submission branch went days without a run. Tags run it too: a version tag publishes the
  # image (the `docker` job), and nothing should publish from an untested commit.
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # A dependency that is clean today can have a CVE published against it tomorrow
    # without a single line of our code changing, so the scanners also run weekly.
    - cron: "0 6 * * 1"

# The default token is read-only unless a job needs more. Stated explicitly so a future
# workflow edit cannot silently inherit write access to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run's answer irrelevant; cancelling it keeps
# the queue short. Tag and scheduled runs are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[acs,dev]"

      # AIM over private-PGM is the project's headline mechanism, and CI had NEVER run it.
      # `mbi` installs from git rather than PyPI, so it was never in the dependency set, so
      # every AIM test skipped -- silently, because a skip is not a failure. That also cost
      # about four points of coverage, which is why the 90% gate could not be met on a runner
      # while the same suite measured 92% locally. Installing it here means the pipeline
      # exercises the mechanism the README leads with.
      #
      # Not continue-on-error: if this install breaks, AIM stops being tested, and that
      # should be loud rather than a quiet return to skipping.
      - name: Install private-PGM (real AIM)
        run: pip install "git+https://github.com/ryan112358/private-pgm.git"

      - name: Lint (ruff)
        run: ruff check synthproof/ tests/ scripts/

      - name: Format check (black)
        # Was advisory "until the tree is fully black-formatted". It now is, so this
        # blocks. An advisory formatter is one nobody runs.
        run: black --check synthproof/ tests/ scripts/

      - name: Type check (mypy)
        # Added 2026-09-12, at zero errors. It was configured but never run, and 79 errors had
        # accumulated behind that -- 52 of them missing third-party stubs, which is noise that
        # HID the 27 real ones. It found an unguarded Optional on the audit path, a `width`
        # property that would have computed a sensitivity from a missing bound, and a
        # generator contract that disagrees with its only control caller.
        run: mypy

      - name: Test with coverage
        # Raised 80 -> 90 on 2026-08-23. Measured 96% on 2026-09-14 (901 passed, 1
        # skipped). Raised to 94 in task T4 / row 3.2 of archive/docs/ROAD_TO_TEN.md.
        run: pytest --cov=synthproof --cov-report=term-missing --cov-fail-under=94

      # The two gates below are specific to this project's discipline, and until now both
      # were manual. On 2026-09-12 both were failing in the committed tree -- which is the
      # outcome you would predict from a gate that nothing runs. They are steps now.

      - name: Dead claims (repository-wide)
        # Promoted from thesis-only to --all on 2026-09-12, once the count reached zero.
        # It covers 75 documents: docs/, results/, research/ and ../REPORTS/. A dead claim
        # can no longer enter ANY of them without failing a build, which matters because the
        # chapters were already clean -- all 73 violations were in the material AROUND them,
        # and that is what an examiner reads first.
        run: python scripts/check_thesis_claims.py --all

      - name: Citations resolve
        run: python scripts/check_citations.py

      - name: Every number in a results document traces to a committed result
        # Added 2026-10-16 after a sweep found 127 numbers in 20 documents that matched no
        # committed result -- stale tables from a re-run, values from deleted experiments, and
        # figures with no source at all. See scripts/check_number_provenance.py and CORRECTIONS.md.
        run: python scripts/check_number_provenance.py

      - name: Generated results tables match their JSON
        run: python -m scripts.build_results_docs --check

      - name: Every relative link in the documentation resolves
        run: python scripts/check_links.py

      - name: Published numbers match the committed manifest
        # Verify-only: hashes the committed result files and compares them to
        # results/MANIFEST.json. It re-runs no experiment, so it is fast and it is
        # deterministic across machines -- it compares file bytes, not recomputed floats.
        run: python -m scripts.reproduce

      # The capsule ships JavaScript that Python emits, and for a while nothing on either
      # side of that boundary could see it: the Python suite asserted substrings, and the
      # console suite never loaded it. A missing `try {` therefore reached users and the page
      # failed to parse with no test noticing. This runs where the package is already
      # installed, and parses what actually gets written.
      - name: Node (for parsing the emitted capsule)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Emitted capsule JavaScript parses, and the bypass stays dead
        run: |
          python scripts/generate_demo_capsules.py
          node -e "
            const fs = require('fs'), vm = require('vm');
            const files = fs.readdirSync('demo_capsules').filter(f => f.endsWith('.html'));
            if (!files.length) { console.error('no capsules emitted'); process.exit(1); }
            for (const f of files) {
              const html = fs.readFileSync('demo_capsules/' + f, 'utf8');
              const m = html.match(/<script>([\s\S]*?)<\/script>/);
              if (!m) { console.error(f + ': no inline script'); process.exit(1); }
              new vm.Script(m[1], { filename: f });
              if (/Proof Format Verified|Verified 64-byte/.test(html)) {
                console.error(f + ': the length-check verification bypass is back');
                process.exit(1);
              }
              console.log(f + ': parses, no bypass');
            }
          "

      - name: Smoke — CLI demo runs end to end
        run: python -m synthproof.cli demo --rows 60 --eps 1.0

  # CodeRabbit reviews pull requests; it does not gate a merge on a published CVE and does
  # not run on a schedule. These scanners do both, so security does not depend on a
  # third-party service being reachable, subscribed, or configured.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a COMMIT RANGE, so it needs the parent of the first commit in the
          # push. The default shallow clone (depth 1) does not contain it, and the action
          # fails with "ambiguous argument <sha>^..<sha>" — which looks like a leak but is
          # git plumbing. Full history is what makes the scan meaningful anyway: a secret
          # that was committed and later removed is still in the history and still leaked.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: SAST (bandit)
        # Fails the build on medium severity and above. B101 (assert_used) fires on every
        # pytest assertion, so `tests/` is scanned with that rule skipped rather than
        # excluded outright — test helpers can still contain real defects.
        run: |
          bandit -c pyproject.toml -r synthproof/ scripts/ -ll
          bandit -r tests/ -ll --skip B101

      - name: Dependency CVEs (pip-audit)
        # `mbi` (private-PGM) installs from git and is not on PyPI, so it cannot be
        # audited; skipping it is recorded here rather than hidden behind --ignore.
        run: pip-audit --skip-editable --progress-spinner off

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The console ships to a browser, so it gets the same treatment as the Python package:
  # types must check, the build must succeed, and its dependency tree must be clean.
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # The console's types are GENERATED from the API's OpenAPI document (synthproof/api/
      # schemas.py -> scripts/export_openapi.py -> web/src/api/openapi.json -> schema.d.ts). The
      # Python side checks the document is current (tests/test_api_contract.py); this checks the
      # TypeScript was regenerated from it. Then `tsc` checks the console against that contract.
      - name: Generated API types match the committed OpenAPI document
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # End-to-end against the REAL stack: the FastAPI service, the bundle it serves, and a
      # genuine DP synthesis run. Every defect that reached users on 2026-09-12 lived at a
      # seam between two layers that each had passing tests of their own -- a capsule whose
      # script would not parse, a preset pointing at a table pre-flight refuses, a tamper
      # endpoint with no test. A seam is what a unit test cannot see.
      - name: Install Python for the e2e stack
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the package (e2e serves the real API)
        working-directory: .
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[acs,dev]"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright)
        # `@slow` is excluded: the one spec that drives a real DP synthesis through the
        # browser takes ~4s locally and does not finish inside nine minutes on a two-core
        # runner. Same reasoning as the `slow` pytest marker -- a per-push check nobody waits
        # for is one people route around. It runs on the weekly schedule below.
        run: npx playwright test --grep-invert "@slow"

      - name: End-to-end, including the slow pipeline run (weekly)
        if: github.event_name == 'schedule'
        run: npx playwright test

      - name: Upload e2e trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

      - name: Dependency CVEs (npm audit)
        # Every dependency, dev included, must be clean and blocks the build. Dev-only
        # advisories used to be a warning while tailwind 3's build chain carried seven of
        # them; the tailwind 4 migration (2026-10-16) cleared the last one.
        run: npm audit --audit-level=moderate

  # The auditor is the instrument behind every privacy claim this project makes, and its
  # failure mode is silent: a blind auditor reports 0.00, which is also what a correct auditor
  # reports on a good mechanism. The first self-audit found exactly that and it went unnoticed.
  # These two controls are what separate "no leakage detected" from "nothing was measured".
  auditor-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Positive and negative controls must both hold
        run: |
          pytest tests/test_detection_floor.py -q \
            -k "detects_a_verbatim_release or does_not_fire or monotone" \
            --no-cov

  # The headline claim of this project is that a requested epsilon is the epsilon you get.
  # If that regresses, everything downstream — every certificate, every published number —
  # becomes false. It is worth its own job.
  calibration-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Assert calibrated epsilon tracks the target and never overspends
        run: |
          python - <<'PY'
          from synthproof.accounting.calibration import (
              calibrate_noise_scale, epsilon_for_noise_scale)

          failures = []
          for name in ("gaussian", "laplace"):
              for steps in (1, 5, 20):
                  for target in (0.5, 1.0, 2.0, 8.0):
                      s = calibrate_noise_scale(target, 1e-5, name, 1.0, steps)
                      got = epsilon_for_noise_scale(s, 1e-5, name, 1.0, steps)
                      if got > target * 1.001:
                          failures.append(f"OVERSPEND {name}/{steps}/{target}: got {got:.6f}")
                      if got < target * 0.99:
                          failures.append(f"LOOSE {name}/{steps}/{target}: got {got:.6f}")
          if failures:
              raise SystemExit("Calibration guard failed:\n  " + "\n  ".join(failures))
          print("Calibration guard passed across 24 configurations.")
          PY

  # The image is what a stranger runs, and until 2026-10-16 CI never built it: it shipped
  # without the console once and without AIM once, and both were found by hand. This builds
  # it, then drives the real service inside it: two signed releases (one of them AIM), a
  # ledger that verifies, the same ledger surviving the container being REPLACED on the same
  # volume (an upgrade), the Docker healthcheck, and the browser suite against the image.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # used only by the publish step, which runs on version tags
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/synthproof
      LEDGER_ENV: >-
        -e SYNTHPROOF_LEDGER_DB=/app/.synthproof/ledger.db
        -e SYNTHPROOF_KEY_DIR=/app/.synthproof/keys
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: synthproof:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — health, two signed releases (pairwise, AIM), ledger verifies
        run: |
          docker volume create sp_ledger
          docker run -d --name sp1 -p 8000:8000 -v sp_ledger:/app/.synthproof $LEDGER_ENV synthproof:ci
          python3 scripts/container_smoke.py --url http://127.0.0.1:8000 --expect-entries 2

      - name: Upgrade keeps the ledger — replace the container on the same volume
        run: |
          docker rm -f sp1
          docker run -d --name sp2 -p 8000:8000 -v sp_ledger:/app/.synthproof $LEDGER_ENV synthproof:ci
          python3 scripts/container_smoke.py --url http://127.0.0.1:8000 --no-run --expect-entries 2

      - name: The Docker healthcheck reports healthy
        run: |
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' sp2)
            echo "health: $s"; [ "$s" = healthy ] && exit 0; sleep 4
          done
          exit 1

      - name: Runs with a read-only root filesystem
        # Everything the service writes goes to the ledger volume or /tmp. If a library starts
        # writing elsewhere (a cache under $HOME, say) this fails rather than the deployment.
        run: |
          docker run -d --name sp_ro --read-only --tmpfs /tmp -p 8001:8000 \
            -v sp_ro_ledger:/app/.synthproof $LEDGER_ENV synthproof:ci
          python3 scripts/container_smoke.py --url http://127.0.0.1:8001 --mechanisms pairwise --expect-entries 1

      - name: Browser end-to-end against the image, slow pipeline spec included
        # The same Playwright suite the console job runs from source, pointed at the container.
        # The @slow spec (a real DP release driven through the UI) runs here: against the
        # built image it takes seconds, whereas launched from source on a 2-core runner it did
        # not finish in nine minutes, which is why the console job still skips it per push.
        # In-memory ledger + demo mode, because the suite exercises the tamper/reset endpoints.
        run: |
          docker run -d --name sp_e2e -p 8765:8000 \
            -e SYNTHPROOF_LEDGER_DB=:memory: -e SYNTHPROOF_DEMO=1 synthproof:ci
          python3 scripts/container_smoke.py --url http://127.0.0.1:8765 --no-run
          cd web && npm ci && npx playwright install --with-deps chromium
          SYNTHPROOF_E2E_BASE_URL=http://127.0.0.1:8765 npx playwright test

      - name: Container logs on failure
        if: failure()
        run: for c in sp1 sp2 sp_ro sp_e2e; do echo "== $c"; docker logs $c 2>&1 | tail -80 || true; done

      # Publishes ONLY from a version tag, and only after every step above passed on that
      # exact commit. No GitHub Release is created here: a Release triggers a new Zenodo DOI,
      # which is the maintainers' decision, not CI's.
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}

  # After publishing, prove the PUBLISHED image works -- not the one this runner built. A
  # registry push can succeed with a broken manifest or the wrong platform; pulling it fresh
  # and driving it is the only check that matches what a user does.
  published-image:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Pull and smoke the published image
        run: |
          img=ghcr.io/${{ github.repository_owner }}/synthproof:${{ github.ref_name }}
          docker pull "$img"
          docker run -d --name pub -p 8000:8000 "$img"
          python3 scripts/container_smoke.py --url http://127.0.0.1:8000 --expect-entries 2
      - name: Browser end-to-end against the published image
        run: |
          img=ghcr.io/${{ github.repository_owner }}/synthproof:${{ github.ref_name }}
          docker run -d --name pub_e2e -p 8765:8000 -e SYNTHPROOF_LEDGER_DB=:memory: -e SYNTHPROOF_DEMO=1 "$img"
          python3 scripts/container_smoke.py --url http://127.0.0.1:8765 --no-run
          cd web && npm ci && npx playwright install --with-deps chromium
          SYNTHPROOF_E2E_BASE_URL=http://127.0.0.1:8765 npx playwright test
