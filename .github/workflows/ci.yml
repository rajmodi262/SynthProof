name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
  schedule:
    # A dependency that is clean today can have a CVE published against it tomorrow
    # without a single line of our code changing, so the scanners also run weekly.
    - cron: "0 6 * * 1"

# The default token is read-only unless a job needs more. Stated explicitly so a future
# workflow edit cannot silently inherit write access to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check synthproof/ tests/ scripts/

      - name: Format check (black)
        # Was advisory "until the tree is fully black-formatted". It now is, so this
        # blocks. An advisory formatter is one nobody runs.
        run: black --check synthproof/ tests/ scripts/

      - name: Test with coverage
        # Raised 80 -> 90 on 2026-08-23. Measured 92% on 2026-09-12 (738 passed, 1
        # skipped) -- the comment here previously said 94%, which was never re-checked
        # after the suite grew. The gate rises to 94 in task 3.2 of docs/ROAD_TO_TEN.md,
        # once the CLI and API modules are brought up from 78% and 80%.
        run: pytest --cov=synthproof --cov-report=term-missing --cov-fail-under=90

      # The two gates below are specific to this project's discipline, and until now both
      # were manual. On 2026-09-12 both were failing in the committed tree -- which is the
      # outcome you would predict from a gate that nothing runs. They are steps now.

      - name: Dead claims (thesis chapters)
        # Thesis-only for the moment. The repo-wide sweep still reports 73 hits in the
        # surrounding documents; task 2.6 flips this to --all once P2 clears them, and a
        # gate that is red on arrival is a gate people learn to ignore.
        run: python scripts/check_thesis_claims.py

      - name: Citations resolve
        run: python scripts/check_citations.py

      - name: Published numbers match the committed manifest
        # Verify-only: hashes the committed result files and compares them to
        # results/MANIFEST.json. It re-runs no experiment, so it is fast and it is
        # deterministic across machines -- it compares file bytes, not recomputed floats.
        run: python -m scripts.reproduce

      - name: Smoke — CLI demo runs end to end
        run: python -m synthproof.cli demo --rows 60 --eps 1.0

  # CodeRabbit reviews pull requests; it does not gate a merge on a published CVE and does
  # not run on a schedule. These scanners do both, so security does not depend on a
  # third-party service being reachable, subscribed, or configured.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans a COMMIT RANGE, so it needs the parent of the first commit in the
          # push. The default shallow clone (depth 1) does not contain it, and the action
          # fails with "ambiguous argument <sha>^..<sha>" — which looks like a leak but is
          # git plumbing. Full history is what makes the scan meaningful anyway: a secret
          # that was committed and later removed is still in the history and still leaked.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"

      - name: SAST (bandit)
        # Fails the build on medium severity and above. B101 (assert_used) fires on every
        # pytest assertion, so `tests/` is scanned with that rule skipped rather than
        # excluded outright — test helpers can still contain real defects.
        run: |
          bandit -c pyproject.toml -r synthproof/ scripts/ -ll
          bandit -r tests/ -ll --skip B101

      - name: Dependency CVEs (pip-audit)
        # `mbi` (private-PGM) installs from git and is not on PyPI, so it cannot be
        # audited; skipping it is recorded here rather than hidden behind --ignore.
        run: pip-audit --skip-editable --progress-spinner off

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The console ships to a browser, so it gets the same treatment as the Python package:
  # types must check, the build must succeed, and its dependency tree must be clean.
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Dependency CVEs (npm audit)
        # Production dependencies must be clean and block the build. Dev-only advisories
        # are reported but do not fail it: they affect the build host, not the shipped
        # bundle, and a tooling advisory should not stop a thesis experiment landing.
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=moderate || echo "::warning::dev-only advisories present"

  # The auditor is the instrument behind every privacy claim this project makes, and its
  # failure mode is silent: a blind auditor reports 0.00, which is also what a correct auditor
  # reports on a good mechanism. The first self-audit found exactly that and it went unnoticed.
  # These two controls are what separate "no leakage detected" from "nothing was measured".
  auditor-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Positive and negative controls must both hold
        run: |
          pytest tests/test_detection_floor.py -q \
            -k "detects_a_verbatim_release or does_not_fire or monotone" \
            --no-cov

  # The headline claim of this project is that a requested epsilon is the epsilon you get.
  # If that regresses, everything downstream — every certificate, every published number —
  # becomes false. It is worth its own job.
  calibration-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
      - name: Assert calibrated epsilon tracks the target and never overspends
        run: |
          python - <<'PY'
          from synthproof.accounting.calibration import (
              calibrate_noise_scale, epsilon_for_noise_scale)

          failures = []
          for name in ("gaussian", "laplace"):
              for steps in (1, 5, 20):
                  for target in (0.5, 1.0, 2.0, 8.0):
                      s = calibrate_noise_scale(target, 1e-5, name, 1.0, steps)
                      got = epsilon_for_noise_scale(s, 1e-5, name, 1.0, steps)
                      if got > target * 1.001:
                          failures.append(f"OVERSPEND {name}/{steps}/{target}: got {got:.6f}")
                      if got < target * 0.99:
                          failures.append(f"LOOSE {name}/{steps}/{target}: got {got:.6f}")
          if failures:
              raise SystemExit("Calibration guard failed:\n  " + "\n  ".join(failures))
          print("Calibration guard passed across 24 configurations.")
          PY
