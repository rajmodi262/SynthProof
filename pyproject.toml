[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthproof"
version = "0.1.0"
description = "Synthetic Data That Ships With Its Proof — Differential Privacy Platform & Adversarial Assurance Engine"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Raj Modi", email = "raj.modi@mitwpu.edu.in"},
    {name = "Krishna Renuse", email = "krishna.renuse@mitwpu.edu.in"},
    {name = "Aaditya Kumar Sinha", email = "aaditya.sinha@mitwpu.edu.in"},
    {name = "Levinesh G R", email = "levinesh.gr@mitwpu.edu.in"}
]
# Only packages actually imported by the codebase are listed. torch, opacus, duckdb and
# pyarrow were previously declared here with zero imports anywhere. autodp was too, and is
# now a DEV dependency because a test genuinely uses it -- see the differential test.
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "dp-accounting>=0.4.0",
    "cryptography>=41.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "python-multipart>=0.0.9",   # required by the /api/upload form endpoint
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.24.0",   # starlette TestClient needs it on newer versions
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "ruff>=0.1.0",
    "black>=23.7.0",
    "mypy>=1.5.0",
    "bandit>=1.7.5",    # Python SAST
    "pip-audit>=2.7.0", # known CVEs in resolved dependencies
    # A SECOND, independent DP accounting implementation. Used only by the differential
    # test: agreement between dp_accounting and autodp is evidence our composed epsilon is
    # right; agreement of our code with itself is not. The test skips if it is absent.
    "autodp>=0.2.3",
    "matplotlib>=3.7"   # thesis figures (scripts/make_figures.py)
]

[project.scripts]
synthproof = "synthproof.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I"]

[tool.ruff.lint.per-file-ignores]
# B008 flags function calls in argument defaults. FastAPI's dependency injection is
# *expressed* that way — `file: UploadFile = File(...)` is the documented idiom, not an
# accident — so the rule does not apply to route handlers.
"synthproof/api/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=synthproof --cov-report=term-missing"

[tool.bandit]
# Vendored environments and build output are not our code.
exclude_dirs = [".venv311", "web", "synthproof/api/console", "build", "dist"]
# B101 (assert_used) fires on every pytest assertion. Asserts are the point of a test
# suite, so the rule is disabled for `tests/` via the CI invocation rather than here,
# where it would also excuse asserts in library code.
skips = []
