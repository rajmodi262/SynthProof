# gitleaks configuration.
#
# Extends the default rule set rather than replacing it, so every stock rule still applies.
# The single allowlist below exists because the default `generic-api-key` heuristic fires on
# the demo capsules, and it is wrong to there in a specific and checkable way.
#
# WHAT IS ACTUALLY IN THOSE FILES. A capsule carries a base64 payload containing the Privacy
# Data Sheet, a 32-byte Ed25519 PUBLIC key, and a 64-byte signature over the sheet's canonical
# bytes. All three are meant to be published: the entire purpose of the artefact is that a
# third party who has only the file and the public key can check the claim. A long
# high-entropy string is what a signature looks like, and `generic-api-key` cannot tell one
# from a credential.
#
# WHAT IS NOT IN THEM. No private key material, ever. `.keys/` is gitignored and has never
# been committed (`git log --all -- .keys/` is empty), and `tests/test_capsule.py` asserts
# directly that no byte of the private key appears in an emitted capsule. That test is the
# real control; this allowlist is only what stops a heuristic from drowning it out.
#
# An allowlist is how a scanner stops being read, so this one is scoped to two paths and one
# rule, and the invariant it assumes is pinned by a test rather than by this comment.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  description = "Self-verifying capsules embed a PUBLIC key and a signature, by design."
  paths = ['''demo_capsules/.*\.html''']
