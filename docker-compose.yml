# SynthProof runs as a single service. The ledger is SQLite, held in a mounted volume so a
# signed hash chain survives container restarts -- a ledger that resets is not a durable record.
#
# There is deliberately NO database service here. An earlier version declared a Postgres
# container and a DATABASE_URL that nothing read: no psycopg dependency, no connection code, no
# migration. It suggested a persistence tier the project does not have, which is the kind of
# claim-without-implementation this project exists to catch.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      # Unset by default so the local demo needs no configuration. /api/health reports
      # auth: "disabled" loudly when it is. One shared key is NOT user authentication.
      - SYNTHPROOF_API_KEY=${SYNTHPROOF_API_KEY:-}
      # The volume below was mounted but nothing pointed at it: the API defaulted to an
      # in-memory ledger, so the "durable" record reset on every restart. These put the ledger
      # AND the key that signs its head on the volume (a ledger whose key changes on restart
      # cannot verify its own head). A file-backed ledger disables the destructive tamper/reset
      # demo endpoints by design; the live tamper demo runs on the local launcher.
      - SYNTHPROOF_LEDGER_DB=/app/.synthproof/ledger.db
      - SYNTHPROOF_KEY_DIR=/app/.synthproof/keys
    volumes:
      - ledger_data:/app/.synthproof
    restart: unless-stopped

volumes:
  ledger_data:
